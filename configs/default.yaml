# Gomoku AI Agent 默认配置
# 训练参数、棋盘规则、搜索参数、网络结构、训练批次等均在此统一管理

board:
  size: 15              # 棋盘尺寸（15×15）
  win_length: 5         # 连成几子获胜

rules:
  use_forbidden_moves: false   # 是否启用禁手规则（预留接口）
  free_rule: true              # 自由规则

encoding:
  channels: 3           # 输入通道数：当前方 / 对手 / 最近落子

search:
  time_limit_ms: 1000        # 每步搜索时间限制（毫秒）
  max_depth: 8               # 最大搜索深度
  candidate_radius: 2        # 候选动作邻居搜索半径
  max_candidates: 12         # 每节点最多候选动作数
  enable_vcf: true           # 是否启用 VCF 战术搜索
  vcf_max_depth: 12          # VCF 最大搜索深度
  vcf_time_limit_ms: 200     # VCF 时间限制（毫秒）
  enable_transposition_table: true   # 是否启用置换表
  transposition_table_size: 1000000  # 置换表容量
  use_transposition_table: true       # 兼容旧配置字段
  use_iterative_deepening: true       # 是否使用迭代加深

network:
  type: cnn             # 网络类型：cnn / resnet
  input_channels: 3
  board_size: 15
  value_range: [-1.0, 1.0]

training:
  self_play_games: 1000
  replay_buffer_size: 100000
  batch_size: 256
  learning_rate: 0.001
  epochs: 10
  use_data_augmentation: true   # 棋盘旋转、翻转等数据增强
  checkpoint_dir: "checkpoints"
  data_dir: "data"

evaluation:
  games_per_match: 100  # 每次竞技场对局数
  elo_k: 32             # Elo 计算的 K 因子
